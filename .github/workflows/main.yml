name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract KYRO project
        run: |
          mkdir -p source
          unzip -q KYRO_Doorstep_Bike_Service_APK_READY.zip -d source

      - name: Find Flutter project
        run: |
          PUBSPEC=$(find source -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          echo "SOURCE_DIR=$(dirname "$PUBSPEC")" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create new Flutter Android project
        run: |
          flutter create --platforms android --org com.kyro kyro_app

      - name: Copy KYRO app code
        run: |
          rm -rf kyro_app/lib
          cp -r "$SOURCE_DIR/lib" kyro_app/lib

          if [ -d "$SOURCE_DIR/assets" ]; then
            cp -r "$SOURCE_DIR/assets" kyro_app/assets
          fi

          cp "$SOURCE_DIR/pubspec.yaml" kyro_app/pubspec.yaml

      - name: Regenerate Android project
        working-directory: kyro_app
        run: flutter create --platforms android .

      - name: Get dependencies
        working-directory: kyro_app
        run: flutter pub get

      - name: Build APK
        working-directory: kyro_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KYRO-APK
          path: kyro_app/build/app/outputs/flutter-apk/app-release.apk
