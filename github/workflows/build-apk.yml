name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -o *.zip -d project
          PROJECT_DIR=$(dirname "$(find project -name pubspec.yaml -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

            - name: Generate Android platform
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .

      - name: Fix Android Gradle Plugin
        run: |
          sed -i 's/8\.7\.3/8.11.1/g' "$PROJECT_DIR/android/build.gradle"
          sed -i 's/8\.7\.3/8.11.1/g' "$PROJECT_DIR/android/settings.gradle"
          echo "android.newDsl=false" >> "$PROJECT_DIR/android/gradle.properties"
          echo "android.builtInKotlin=false" >> "$PROJECT_DIR/android/gradle.properties"
          rm -f "$PROJECT_DIR/android/app/build.gradle.kts"

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kyro-Bike-Service-APK
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
